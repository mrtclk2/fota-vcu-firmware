name: SecureGateway
options:
  bundleIdPrefix: com.mrtclk2
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  SecureGateway:
    type: application
    platform: iOS
    sources:
      - path: SecureGateway/SecureGateway
        excludes:
          - "Resources/Info.plist"
    info:
      path: SecureGateway/SecureGateway/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrtclk2.securegateway
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
